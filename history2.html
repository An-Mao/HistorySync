<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>同步历史记录</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-overrides.css"><link rel="stylesheet" href="effects.css"><link rel="stylesheet" href="mobile.css"></head><body class="history-page"><aside id="side" class="side-panel"><button id="closeSide" class="side-close">×</button><div class="toolbar"><button id="download">下载</button><button id="upload" class="ghost">上传</button><button id="settings" class="ghost">设置</button></div><section class="date-card"><button id="previous" class="icon-button">‹</button><label>浏览日期<input id="date" type="date"></label><button id="next" class="icon-button">›</button></section><div id="recentDates" class="date-tabs"></div></aside><header class="app-header"><div><p class="eyebrow">HISTORY SYNC</p><h1>历史记录</h1><p id="lastSync" class="last-sync"></p></div><button id="toggleSide" class="side-toggle ghost">☰</button></header><main><section class="history-controls"><input id="search" type="search" placeholder="搜索全部已有历史记录"><span id="summary"></span></section><p id="status"></p><ol id="list" class="history-list"></ol><nav id="pagination" class="pagination"></nav></main><script src="theme.js"></script><script src="theme-extra.js"></script><script src="history2.js"></script></body></html>
