<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>同步历史记录</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"></head><body class="history-page"><header class="app-header"><div><p class="eyebrow">HISTORY SYNC</p><h1>历史记录</h1></div><div class="toolbar"><button id="download">下载</button><button id="upload" class="ghost">上传</button><button id="settings" class="ghost">设置</button></div></header><main><section class="date-card"><button id="previous" class="icon-button" aria-label="前一天">‹</button><label>浏览日期<input id="date" type="date"></label><button id="next" class="icon-button" aria-label="后一天">›</button></section><div id="recentDates" class="date-tabs" aria-label="最近日期"></div><section class="history-controls"><input id="search" type="search" placeholder="搜索当前日期的标题或网址"><span id="summary"></span></section><p id="status" role="status"></p><ol id="list" class="history-list"></ol><nav id="pagination" class="pagination" aria-label="历史记录分页"></nav></main><script src="history.js"></script></body></html>
