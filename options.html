<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>历史记录同步设置</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-overrides.css"></head><body><main><h1>历史记录 WebDAV 同步</h1><form id="settings"><label>WebDAV 地址<input name="webdavUrl" type="url" required></label><label>远端目录<input name="remotePath" placeholder="chrome-history"></label><label>用户名<input name="username"></label><label>密码 / 应用专用密码<input name="password" type="password"></label><label>数据加密密码（可选）<input name="encryptionPassword" type="password"></label><fieldset><legend>界面与同步</legend><label>设备标识<input name="deviceId" maxlength="80"></label><label>日期栏浮动位置<select name="dateTabsPosition"><option value="top">顶部</option><option value="bottom">底部</option></select></label><label>列表加载模式<select name="listMode"><option value="pages">普通翻页</option><option value="infinite">滚动自动加载</option></select></label><label>配色模式<select name="themeMode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>预设主题<select name="themePreset"><option value="violet">紫罗兰</option><option value="forest">森林</option><option value="sunset">日落</option><option value="ocean">海洋</option><option value="mono">极简灰</option><option value="custom">自定义</option></select></label><div id="customTheme"><label>主色<input name="themeAccent" type="color" value="#7c3aed"></label><label>背景色<input name="themeBackground" type="color" value="#f7f5ff"></label><label>文字色<input name="themeText" type="color" value="#242132"></label></div><label class="check"><input name="autoDownloadOnEmpty" type="checkbox">查看某日无本地数据时自动下载</label><label class="check"><input name="importToNativeHistory" type="checkbox">导入 Chrome 原生历史（默认关闭）</label></fieldset><label>同步天数<input name="syncDays" type="number" min="1" max="365"></label><label>自动同步间隔（分钟）<input name="syncIntervalMinutes" type="number" min="5"></label><button>保存设置</button><span id="status" role="status"></span></form><section class="pairing"><h2>快速添加设备</h2><p>导出不含密码的配对码；新设备粘贴后仍需填写 WebDAV 密码与加密密码。</p><textarea id="pairCode" readonly></textarea><button type="button" id="copyPair">复制配对码</button><label>导入配对码<textarea id="importPair"></textarea></label><button type="button" id="applyPair">导入配对码</button></section></main><script src="theme.js"></script><script src="options.js"></script></body></html>
