<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>历史记录同步设置</title><link rel="stylesheet" href="style.css"></head><body><main><h1>历史记录 WebDAV 同步</h1><p>记录访问时间与前台停留时长；每天一个 JSON 文件。同步会自动合并本地和远端差异。</p><form id="settings"><label>WebDAV 地址<input name="webdavUrl" type="url" placeholder="https://dav.example.com/remote.php/dav/files/name" required></label><label>远端目录<input name="remotePath" placeholder="chrome-history"></label><label>用户名<input name="username" autocomplete="username"></label><label>密码 / 应用专用密码<input name="password" type="password" autocomplete="current-password"></label><label>数据加密密码（可选）<input name="encryptionPassword" type="password" autocomplete="new-password" placeholder="启用 AES-256-GCM 端到端加密"></label><p class="hint">启用后，WebDAV 仅保存加密内容。所有设备必须使用相同密码；遗失后无法恢复数据。</p><fieldset><legend>本地显示与导入</legend><label>设备标识<input name="deviceId" maxlength="80" placeholder="例如：工作电脑"></label><p class="hint">新写入的历史将附带此标识；其他设备的记录会显示云朵图标。</p><label>日期栏浮动位置<select name="dateTabsPosition"><option value="top">顶部</option><option value="bottom">底部</option></select></label><label class="check"><input name="autoDownloadOnEmpty" type="checkbox">查看某日无本地数据时，自动下载该日期</label><label class="check"><input name="importToNativeHistory" type="checkbox">将下载记录导入 Chrome 原生历史（默认关闭）</label><p class="hint">Chrome 只能以导入时刻写入记录，无法还原原始访问时间；建议使用扩展历史页查看真实时间。</p></fieldset><label>同步天数<input name="syncDays" type="number" min="1" max="365" value="7"></label><label>自动同步间隔（分钟，最少 5）<input name="syncIntervalMinutes" type="number" min="5" value="60"></label><button>保存设置</button><span id="status" role="status"></span></form></main><script src="options.js"></script></body></html>
