<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>同步历史记录</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-overrides.css"><link rel="stylesheet" href="effects.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="layout4.css"><link rel="stylesheet" href="layout5.css"></head><body class="history-page"><aside id="side" class="side-panel"><button id="closeSide" class="side-close">×</button><div class="toolbar"><button id="download">下载</button><button id="upload" class="ghost">上传</button><button id="settings" class="ghost">设置</button></div><section class="calendar"><h2>浏览日期</h2><label>单日<input id="date" type="date"></label><label>开始日期<input id="rangeStart" type="date"></label><label>结束日期<input id="rangeEnd" type="date"></label><div class="calendar-footer"><button id="previous" class="icon-button">‹</button><span id="storageInfo"></span><button id="next" class="icon-button">›</button></div></section></aside><header class="app-header"><div><p class="eyebrow">HISTORY SYNC</p><h1>历史记录</h1><p id="lastSync" class="last-sync"></p></div><button id="toggleSide" class="side-toggle ghost">☰</button></header><main><section class="top-controls"><div id="recentDates" class="date-tabs"></div><input id="search" type="search" placeholder="搜索全部已有历史记录"></section><p id="status"></p><p id="summary" class="summary-line"></p><ol id="list" class="history-list"></ol><nav id="pagination" class="pagination"></nav></main><script src="theme.js"></script><script src="theme-extra.js"></script><script src="history2.js"></script><script src="history5extra.js"></script></body></html>
