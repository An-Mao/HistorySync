<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>历史同步设置</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-overrides.css"><link rel="stylesheet" href="effects2.css"><link rel="stylesheet" href="options2.css"></head><body class="settings-page"><aside class="settings-side"><p class="eyebrow">HISTORY SYNC</p><h1>设置</h1><nav id="nav"><button data-page="sync" class="selected">同步设置</button><button data-page="browse">浏览设置</button><button data-page="theme">主题</button><button data-page="pair">配对</button></nav></aside><header class="settings-header"><h2 id="pageTitle">同步设置</h2><button id="save">保存设置</button><span id="status"></span></header><main class="settings-main"><section data-page="sync"><label>WebDAV 地址<input name="webdavUrl" type="url"></label><label>远端目录<input name="remotePath"></label><label>用户名<input name="username"></label><label>密码 / 应用专用密码<input name="password" type="password"></label><label>数据加密密码<input name="encryptionPassword" type="password"></label><label>同步天数<input name="syncDays" type="number" min="1" max="365"></label><label>自动同步间隔（分钟）<input name="syncIntervalMinutes" type="number" min="5"></label></section><section data-page="browse" hidden><label>设备标识<input name="deviceId"></label><label>语言<select name="language"><option value="auto">跟随浏览器</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><label>列表加载模式<select name="listMode"><option value="pages">普通翻页</option><option value="infinite">滚动自动加载</option></select></label><label>日期栏位置<select name="dateTabsPosition"><option value="top">顶部</option><option value="bottom">底部</option></select></label><label class="check"><input name="autoDownloadOnEmpty" type="checkbox">查看无本地数据日期时自动下载</label><label class="check"><input name="importToNativeHistory" type="checkbox">导入 Chrome 原生历史</label><label class="check"><input name="openPluginHistoryOnNative" type="checkbox">打开 Chrome 原生历史时打开扩展历史</label></section><section data-page="theme" hidden><label>配色模式<select name="themeMode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>主题<select name="themePreset"><option value="violet">紫罗兰</option><option value="forest">森林</option><option value="sunset">日落</option><option value="ocean">海洋</option><option value="mono">极简灰</option><option value="cyber">赛博</option><option value="sakura">日系樱花</option><option value="auto">从背景取色</option><option value="custom">自定义主题</option></select></label><div id="customFields"><label>主色<input name="themeAccent" type="color"></label><label>背景色<input name="themeBackground" type="color"></label><label>文字色<input name="themeText" type="color"></label></div><label>页面背景<select name="backgroundType"><option value="solid">纯色</option><option value="gradient">渐变</option><option value="image">图片 URL</option><option value="image-base64">图片 Base64</option><option value="image-local">选择本地图片</option></select></label><label id="backgroundValueLabel">背景内容<input name="backgroundValue" placeholder="#f7f5ff、渐变、图片 URL 或 data:image/..."></label><label id="backgroundFileLabel" hidden>本地图片<input id="backgroundFile" type="file" accept="image/*"></label><label>自动取色基色<input name="backgroundBase" type="color"></label><label>显示效果<select name="visualEffect"><option value="none">标准</option><option value="oled">OLED</option><option value="frosted">毛玻璃</option><option value="glass">玻璃</option><option value="mica">云母</option><option value="cyberpunk">赛博朋克</option><option value="japanese">日系</option></select></label><p id="effectHint" class="hint"></p></section><section data-page="pair" hidden><p>配对码不含 WebDAV 密码和加密密码。</p><label>导出配对码<textarea id="pairCode" readonly></textarea></label><button id="copyPair" class="secondary">复制配对码</button><label>导入配对码<textarea id="importPair"></textarea></label><button id="applyPair" class="secondary">导入配对码</button></section></main><script src="theme.js"></script><script src="theme-extra.js"></script><script src="options3.js"></script></body></html>
